.vignette{

  background:
    linear-gradient(90deg, rgba(4,4,3,.64) 0%, rgba(4,4,3,.18) 42%, rgba(4,4,3,.04) 72%, rgba(4,4,3,.20) 100%),
    linear-gradient(180deg, rgba(4,4,3,.44), rgba(4,4,3,.02) 24%, rgba(4,4,3,.02) 76%, rgba(4,4,3,.42) 100%);
}
.grain{

  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
  mix-blend-mode:soft-light;
}

/* Masks to hide all text baked into the artwork */



/* New left-style top navigation */
.hero-nav-wrap{
  position:absolute;z-index:8;
  left:4.2%;top:12.7%;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.hero-nav{
  display:flex;align-items:center;gap:0;flex-wrap:wrap;
  max-width:72vw;
}
.hero-nav .nav-btn{
  border:0;background:transparent;padding:0 15px 0 0;position:relative;
  cursor:pointer;color:rgba(218,184,127,.88);
  text-transform:uppercase;font-size:11px;letter-spacing:.22em;
  transition:color .2s var(--ease), transform .2s var(--ease);
}
.hero-nav .nav-btn:hover,
.hero-nav .nav-btn.active{color:#f1d6aa}
.hero-nav .nav-btn:not(:last-child)::after{
  content:"•"; position:absolute; right:6px; top:50%; transform:translateY(-50%);
  color:rgba(218,184,127,.52); font-size:10px; pointer-events:none;
}
.lang-toggle{
  border:1px solid rgba(227,194,139,.26);
  background:rgba(20,17,13,.45);
  color:var(--gold2); min-width:40px; height:30px;
  border-radius:999px; cursor:pointer; backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px); font-size:10px; letter-spacing:.10em;
}
.menu-btn{display:none;border:0;background:rgba(20,17,13,.48);color:var(--cream);width:36px;height:36px;border-radius:50%;cursor:pointer}

/* Hero content */
.hero-copy{
  position:absolute;z-index:8;
  left:4.2%;top:23.8%;
  width:min(31.5%,520px);
}
.hero-title{
  margin:0;
  font-weight:400;
  font-size:clamp(78px,7.2vw,118px);
  line-height:.94;
  color:#f4ebda;
}
.hero-subtitle{
  margin:14px 0 0;
  font-weight:400;
  font-size:clamp(28px,2.8vw,56px);
  line-height:1.08;
  color:#d4ac75;
}
.hero-desc{
  margin:22px 0 0;
  max-width:580px;
  color:rgba(240,225,199,.92);
  font-size:clamp(17px,1.55vw,23px);
  line-height:1.36;
}
.cta-row{margin-top:30px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.teaser-btn{
  display:inline-flex;align-items:center;gap:14px;
  padding:15px 27px;border-radius:999px;border:1px solid rgba(241,213,162,.22);
  background:#d4ae72;color:#17110a;cursor:pointer;font-size:18px;
  box-shadow:0 14px 34px rgba(0,0,0,.2);
  transition:transform .2s var(--ease), filter .2s var(--ease);
}
.teaser-btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.teaser-btn .play{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  background:#12100c;color:#f4d39f;font-size:12px;padding-left:2px;
}

.hero-quote{
  position:absolute;z-index:8;
  right:4.2%; top:27.6%;
  width:min(15.6%,250px);
  text-align:right;
  color:var(--gold);
}
.hero-quote .fa-quote{
  margin:0 0 10px;
  font-size:clamp(24px,1.9vw,34px);
  line-height:1.45;
}
.hero-quote .en-quote{
  margin:0;
  font-style:italic;
  color:rgba(229,188,121,.74);
  font-size:clamp(18px,1.3vw,24px);
  line-height:1.45;
}

.hint{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  z-index:7;padding:8px 14px;border-radius:999px;
  color:rgba(240,225,199,.52);font-size:11px;letter-spacing:.08em;
}

/* panel / feed */
.scrim{
  position:absolute;inset:0;z-index:20;
  background:rgba(3,3,2,.28);opacity:0;pointer-events:none;
  transition:opacity .32s var(--ease);
}
.app.panel-open .scrim,.app.video-open .scrim{opacity:1;pointer-events:auto}

.panel{
  position:absolute;z-index:30;
  top:8.7%; right:3%;
  width:min(520px,40vw);
  bottom:3.5%;
  border:1px solid var(--line); border-radius:28px;
  background:linear-gradient(180deg, rgba(36,30,23,.72), rgba(12,10,8,.82));
  backdrop-filter:blur(28px) saturate(1.05); -webkit-backdrop-filter:blur(28px) saturate(1.05);
  box-shadow:var(--shadow);
  transform:translateX(calc(100% + 60px)); opacity:0; pointer-events:none;
  transition:transform .46s var(--ease), opacity .3s var(--ease);
  overflow:hidden;
}
.app.panel-open .panel{transform:translateX(0); opacity:1; pointer-events:auto}
.panel-head{padding:28px 28px 18px; border-bottom:1px solid rgba(229,196,140,.12); position:relative}
.panel-head .eyebrow{text-transform:uppercase; color:var(--gold); font-size:10px; letter-spacing:.2em; margin-bottom:8px}
.panel-title{margin:0; padding-right:42px; font-size:clamp(30px,2vw,40px); font-weight:400; line-height:1.08}
.panel-desc{margin:10px 42px 0 0; color:var(--muted); font:14px/1.65 "Times New Roman", Times, serif}
.icon-btn{
  position:absolute; right:18px; top:18px; width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(229,196,140,.16); background:rgba(255,255,255,.04); color:var(--cream);
  cursor:pointer; font-size:20px; display:grid; place-items:center;
}
.feed{
  height:calc(100% - 134px); overflow:auto; padding:18px 18px 28px;
  scrollbar-width:thin; scrollbar-color:rgba(214,173,114,.34) transparent;
}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:rgba(214,173,114,.25);border-radius:99px}

.card{
  width:100%; display:block; text-align:left;
  border:1px solid rgba(229,196,140,.11); border-radius:18px;
  background:linear-gradient(140deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
  margin:0 0 12px; padding:18px 18px 16px;
  color:inherit; cursor:pointer; transition:.22s var(--ease);
}
.card:hover{transform:translateY(-2px); border-color:rgba(229,196,140,.22)}
.card-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card-kicker{color:var(--gold); font:10px/1.2 "Times New Roman", Times, serif; text-transform:uppercase; letter-spacing:.15em; margin-bottom:8px}
.card h3{margin:0; font-size:20px; font-weight:400; line-height:1.25}
.card p{margin:9px 0 0; color:rgba(240,225,199,.68); font:13px/1.65 "Times New Roman", Times, serif}
.chev{font-size:18px; color:var(--gold2); transition:transform .2s var(--ease)}
.card.open .chev{transform:rotate(90deg)}
.card-extra{display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease)}
.card.open .card-extra{grid-template-rows:1fr}
.card-extra>div{overflow:hidden}
.extra-inner{margin-top:14px;padding-top:14px;border-top:1px solid rgba(229,196,140,.1); color:rgba(240,225,199,.76); font:13px/1.7 "Times New Roman", Times, serif}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{padding:6px 9px;border-radius:999px;background:rgba(214,173,114,.1); color:rgba(244,216,171,.9); font:10px/1 "Times New Roman", Times, serif}

/* video modal */
.video-modal{
  position:absolute;z-index:40;left:50%;top:50%;
  width:min(860px,76vw); height:min(520px,72vh);
  transform:translate(-50%,-48%) scale(.96);
  border-radius:28px; border:1px solid rgba(229,196,140,.2);
  background:rgba(11,9,8,.84); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
  box-shadow:var(--shadow); opacity:0; pointer-events:none; overflow:hidden;
  transition:.35s var(--ease);

@media(max-width:900px){

  .hero-nav.mobile-open{display:flex;flex-direction:column;align-items:flex-start;gap:10px}

  .menu-btn{display:grid;place-items:center}
  .hero-copy{left:4%;top:20%;width:48%}
  .hero-quote{display:none}
  .panel{left:12px;right:12px;top:80px;bottom:12px;width:auto;transform:translateY(110%)}

  .video-modal{width:calc(100vw - 24px); height:min(520px,72vh)}
}
@media(max-width:680px){
      .hero-copy{left:5%;top:22%;width:58%}

  .hero-subtitle{font-size:23px;margin-top:10px}
  .hero-desc{font-size:13px;margin-top:16px;line-height:1.5}

  .teaser-btn{font-size:14px;padding:12px 18px}
}

html[lang="fa"] .hero-copy,

html[lang="fa"] .card,
html[lang="fa"] .video-copy {
  direction:ltr !important;
  text-align:left !important;
}
html[lang="fa"] .hero-copy,
html[lang="fa"] .panel,
html[lang="fa"] .hero-nav-wrap,
html[lang="fa"] .hero-quote {
  left:auto;
  right:auto;
}

let lang = "en";
let currentSection = null;

const app = document.getElementById("app");
const nav = document.getElementById("nav");
const feed = document.getElementById("feed");
const panel = document.getElementById("panel");
const videoFrame = document.getElementById("videoFrame");
const panelEyebrow = document.getElementById("panelEyebrow");
const panelTitle = document.getElementById("panelTitle");
const panelDesc = document.getElementById("panelDesc");

function renderNav(){
  nav.innerHTML = DATA[lang].nav.map(([id,label]) => 
    `<button class="nav-btn ${id===currentSection?"active":""}" type="button" data-section="${id}">${label}</button>`
  ).join("");
  nav.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => openSection(btn.dataset.section));
  });
}

function renderHero(){
  const hero = DATA[lang].hero;
  document.documentElement.lang = lang;
  document.documentElement.dir = "ltr";
  app.classList.toggle("fa-mode", lang === "fa");
  document.getElementById("heroTitle").textContent = hero.title;
  document.getElementById("heroSubtitle").innerHTML = hero.subtitle.replace(/\n/g, "<br>");
  document.getElementById("heroDesc").textContent = hero.desc;
  document.getElementById("heroCta").textContent = hero.cta;
  document.getElementById("hintText").textContent = hero.hint;
  document.getElementById("modalTitle").textContent = hero.modalTitle;
  document.getElementById("modalNote").textContent = hero.modalNote;
  document.getElementById("langBtn").textContent = lang === "en" ? "FA" : "EN";
  renderNav();
}

function cardHTML(c,idx){
  return `
  <button class="card" type="button" data-card="${idx}" ${c.action?`data-action="${c.action}"`:""}>
    <div class="card-top">
      <div>
        <div class="card-kicker">${c.k}</div>
        <h3>${c.t}</h3>
      </div>
      <span class="chev">›</span>
    </div>
    <p>${c.p}</p>
    <div class="card-extra"><div>
      <div class="extra-inner">${c.x}
        <div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
    </div></div>
  </button>`;
}

function renderSection(id){
  const s = DATA[lang].sections[id];
  panelEyebrow.textContent = s.eyebrow;
  panelTitle.textContent = s.title;
  panelDesc.textContent = s.desc;
  feed.innerHTML = s.cards.map(cardHTML).join("");
  feed.scrollTop = 0;
  feed.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      const action = card.dataset.action;
      if(action === "teaser"){ openVideo(); return; }
      const wasOpen = card.classList.contains("open");
      feed.querySelectorAll(".card.open").forEach(x => x.classList.remove("open"));
      if(!wasOpen) card.classList.add("open");
    });
  });
}

function openSection(id){
  currentSection = id;
  closeVideo();
  renderNav();
  renderSection(id);
  app.classList.add("panel-open");
  panel.setAttribute("aria-hidden","false");
  nav.classList.remove("mobile-open");
}

function closePanel(){
  app.classList.remove("panel-open");
  panel.setAttribute("aria-hidden","true");
  currentSection = null;
  renderNav();
}

function openVideo(){
  closePanel();
  app.classList.add("video-open");
  document.getElementById("videoModal").setAttribute("aria-hidden","false");
  if(TEASER_URL){
    videoFrame.src = TEASER_URL;
    videoFrame.style.display = "block";
  } else {
    videoFrame.style.display = "none";
  }
}

function closeVideo(){
  app.classList.remove("video-open");
  document.getElementById("videoModal").setAttribute("aria-hidden","true");
  videoFrame.src = "";
}

document.getElementById("heroTeaserBtn").addEventListener("click", openVideo);
document.getElementById("panelClose").addEventListener("click", closePanel);
document.getElementById("videoClose").addEventListener("click", closeVideo);
document.getElementById("scrim").addEventListener("click", () => { closePanel(); closeVideo(); });
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "fa" : "en";
  renderHero();
  if(currentSection) renderSection(currentSection);
});
document.getElementById("menuBtn").addEventListener("click", () => nav.classList.toggle("mobile-open"));
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closePanel(); closeVideo(); nav.classList.remove("mobile-open"); }
});


// Explicitly request the Persian webfont in Safari as soon as the page loads.
if (document.fonts && document.fonts.load) {
  document.fonts.load('500 18px "Reem Kufi Fun Variable"').catch(() => {});
  document.fonts.load('600 18px "Reem Kufi Fun Variable"').catch(() => {});
}


if (document.fonts && document.fonts.load) {
  document.fonts.load('500 20px "Reem Kufi Fun Variable"').catch(() => {});
}

renderHero();
</script>
</body>
</html>
