  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
  mix-blend-mode:soft-light;
}

/* TOP NAV */
.topbar{
  position:absolute;
  top:max(18px,env(safe-area-inset-top));
  left:clamp(22px,4.4vw,78px);
  right:clamp(22px,4.4vw,78px);
  height:58px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:20;
}
.brand{
  display:flex;align-items:center;gap:14px;
  border:0;background:transparent;padding:0;cursor:pointer;
  text-align:left;color:var(--cream);
}
.brand-mark{
  font-size:clamp(16px,1.45vw,25px);
  letter-spacing:.34em;
  line-height:1;
  text-shadow:0 3px 24px rgba(0,0,0,.6);
}
.brand-sub{
  margin-top:5px;font-size:10px;letter-spacing:.11em;color:rgba(239,226,202,.72)
}
.nav-shell{
  display:flex;align-items:center;gap:10px;
  padding:6px 7px 6px 13px;
  border:1px solid rgba(232,199,145,.12);
  border-radius:999px;
  background:rgba(8,7,5,.28);
  backdrop-filter:blur(14px) saturate(1.05);
  -webkit-backdrop-filter:blur(14px) saturate(1.05);
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}
.nav{
  display:flex;align-items:center;gap:2px;
}
.nav-btn{
  border:0;background:transparent;cursor:pointer;
  color:rgba(239,226,202,.76);
  padding:10px 12px;border-radius:999px;
  font-size:13px;letter-spacing:.02em;
  transition:.22s var(--ease);
}
.nav-btn:hover,.nav-btn.active{
  color:#fff4df;background:rgba(229,187,121,.12)
}
.lang{
  height:32px;min-width:48px;padding:0 10px;border-radius:999px;
  border:1px solid rgba(232,199,145,.18);
  background:rgba(255,255,255,.035);
  color:var(--gold2);cursor:pointer;font-size:11px;letter-spacing:.08em;
}
.menu-btn{display:none}

/* clickable overlay over the baked teaser button */
.teaser-hit{
  position:absolute;
  left:5.95%;top:51.05%;
  width:14.6%;height:6.7%;
  border:0;border-radius:999px;background:transparent;cursor:pointer;z-index:8;
}
.teaser-hit:focus-visible,.nav-btn:focus-visible,.brand:focus-visible,.lang:focus-visible,
.icon-btn:focus-visible,.card:focus-visible,.modal-close:focus-visible{
  outline:2px solid var(--gold2);outline-offset:3px
}

/* PANEL / FEED */
.scrim{
  position:absolute;inset:0;z-index:24;
  background:rgba(3,3,2,.26);
  opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease);
}
.app.panel-open .scrim,.app.video-open .scrim{opacity:1;pointer-events:auto}

.panel{
  position:absolute;
  z-index:30;
  top:94px;
  right:clamp(22px,4.4vw,78px);
  bottom:clamp(22px,3.6vh,46px);
  width:min(520px,42vw);
  border:1px solid var(--line);
  border-radius:28px;
  background:
    linear-gradient(180deg,rgba(35,29,22,.70),rgba(12,10,8,.76));
  backdrop-filter:blur(28px) saturate(1.05);
  -webkit-backdrop-filter:blur(28px) saturate(1.05);
  box-shadow:var(--shadow);
  transform:translateX(calc(100% + 110px)) scale(.98);
  opacity:0;pointer-events:none;
  transition:transform .48s var(--ease),opacity .32s var(--ease);
  overflow:hidden;
}
.app.panel-open .panel{
  transform:translateX(0) scale(1);opacity:1;pointer-events:auto
}
.panel::before{
  content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(244,211,160,.52),transparent)
}
.panel-head{
  position:relative;
  padding:28px 28px 20px;
  border-bottom:1px solid rgba(232,199,145,.12)
}
.eyebrow{
  color:var(--gold);text-transform:uppercase;letter-spacing:.22em;
  font-size:10px;margin-bottom:9px
}
.panel-title{
  margin:0;padding-right:48px;
  font-weight:400;font-size:clamp(27px,2.15vw,38px);line-height:1.06
}
.panel-desc{
  margin:10px 48px 0 0;color:var(--muted);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.icon-btn{
  position:absolute;right:20px;top:20px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(232,199,145,.14);background:rgba(255,255,255,.04);
  color:var(--cream);cursor:pointer;font-size:20px;line-height:1;
  display:grid;place-items:center;transition:.22s
}
.icon-btn:hover{background:rgba(220,179,112,.14);transform:rotate(4deg)}
.feed{
  height:calc(100% - 130px);
  overflow:auto;overscroll-behavior:contain;
  padding:18px 18px 28px;
  scrollbar-width:thin;scrollbar-color:rgba(215,177,115,.34) transparent
}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:rgba(215,177,115,.26);border-radius:99px}
.card{
  width:100%;display:block;text-align:left;color:inherit;
  margin:0 0 12px;padding:18px 18px 16px;
  border:1px solid rgba(232,199,145,.11);border-radius:18px;
  background:linear-gradient(140deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  cursor:pointer;transition:.25s var(--ease);
}
.card:hover{transform:translateY(-2px);border-color:rgba(232,199,145,.25);background:rgba(255,255,255,.065)}
.card-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card-kicker{
  color:var(--gold);font:10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px
}
.card h3{font-weight:400;font-size:19px;line-height:1.25;margin:0}
.chev{color:var(--gold2);font-size:18px;transition:transform .25s var(--ease)}
.card.open .chev{transform:rotate(90deg)}
.card p{
  color:rgba(239,226,202,.68);
  font:13px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:9px 0 0
}
.card-extra{
  display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)
}
.card.open .card-extra{grid-template-rows:1fr}
.card-extra>div{overflow:hidden}
.extra-inner{
  margin-top:14px;padding-top:14px;border-top:1px solid rgba(232,199,145,.10);
  color:rgba(239,226,202,.72);
  font:13px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{
  padding:6px 9px;border-radius:999px;background:rgba(215,174,109,.095);
  color:rgba(241,213,170,.88);font:10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

/* VIDEO MODAL */
.video-modal{
  position:absolute;z-index:40;left:50%;top:50%;
  width:min(820px,74vw);height:min(480px,68vh);
  transform:translate(-50%,-48%) scale(.96);
  border-radius:28px;border:1px solid rgba(232,199,145,.20);
  background:rgba(12,10,8,.82);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:.35s var(--ease);overflow:hidden;
}
.app.video-open .video-modal{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.video-inner{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto}
.video-stage{
  position:relative;display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 40%,rgba(176,133,76,.18),transparent 42%),
    linear-gradient(135deg,#15110d,#090806)
}

.play-glyph{
  width:78px;height:78px;border-radius:50%;z-index:1;display:grid;place-items:center;
  border:1px solid rgba(245,215,168,.42);background:rgba(0,0,0,.28);
  font-size:29px;padding-left:5px
}
.video-copy{
  position:relative;padding:20px 24px 22px;border-top:1px solid rgba(232,199,145,.12);
  background:rgba(10,8,6,.72)
}
.video-copy h3{margin:0 46px 5px 0;font-weight:400;font-size:21px}
.video-copy p{margin:0;color:var(--muted);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.modal-close{
  position:absolute;right:18px;top:18px;z-index:3;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(232,199,145,.18);background:rgba(0,0,0,.32);color:#fff;cursor:pointer;font-size:20px
}
.video-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;z-index:2;background:#000}

/* bottom hint */
.hint{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  z-index:10;padding:8px 12px;border-radius:999px;
  background:rgba(8,7,5,.24);backdrop-filter:blur(10px);
  color:rgba(239,226,202,.55);font:10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.08em;opacity:.8;transition:.25s;pointer-events:none
}
.app.panel-open .hint,.app.video-open .hint{opacity:0}

/* FA */
html[dir="rtl"] body{font-family:Tahoma,"Segoe UI",sans-serif}
html[dir="rtl"] .brand{text-align:right}
html[dir="rtl"] .brand-mark{letter-spacing:.12em;font-family:Georgia,"Times New Roman",serif}
html[dir="rtl"] .panel{right:auto;left:clamp(22px,4.4vw,78px);transform:translateX(calc(-100% - 110px)) scale(.98)}
html[dir="rtl"] .app.panel-open .panel{transform:translateX(0) scale(1)}
html[dir="rtl"] .panel-title{padding-right:0;padding-left:48px}
html[dir="rtl"] .panel-desc{margin-right:0;margin-left:48px}
html[dir="rtl"] .icon-btn{right:auto;left:20px}
html[dir="rtl"] .card{text-align:right}
html[dir="rtl"] .card-kicker{letter-spacing:.03em}
html[dir="rtl"] .video-copy h3{margin-right:0;margin-left:46px}

/* MOBILE */
@media(max-width:900px){
  .topbar{left:16px;right:16px;top:10px}
  .brand-sub{display:none}
  .nav-shell{padding:5px}
  .nav{display:none;position:absolute;right:0;top:58px;width:min(300px,86vw);
    flex-direction:column;align-items:stretch;padding:10px;border-radius:18px;
    background:rgba(12,10,8,.92);border:1px solid var(--line);backdrop-filter:blur(24px)}
  .nav.mobile-open{display:flex}
  .nav-btn{text-align:left;padding:12px 14px}
  .menu-btn{display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;color:var(--cream);font-size:20px;cursor:pointer}
  .panel{top:78px;left:12px!important;right:12px!important;bottom:12px;width:auto;transform:translateY(110%) scale(.98)!important}
  .app.panel-open .panel{transform:translateY(0) scale(1)!important}
  .video-modal{width:calc(100vw - 24px);height:min(520px,74vh)}
  .teaser-hit{left:5.6%;top:50.5%;width:23%;height:8%}
  .hint{display:none}
}
@media(max-width:560px){
  .scene{background-position:60% center}
  .brand-mark{font-size:15px}
  .lang{min-width:42px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

let lang = "en";
let currentSection = null;

const app = document.getElementById("app");
const nav = document.getElementById("nav");
const panel = document.getElementById("panel");
const feed = document.getElementById("feed");
const panelTitle = document.getElementById("panelTitle");
const panelDesc = document.getElementById("panelDesc");
const panelEyebrow = document.getElementById("panelEyebrow");
const langBtn = document.getElementById("langBtn");
const menuBtn = document.getElementById("menuBtn");
const videoFrame = document.getElementById("videoFrame");

function renderNav(){
  nav.innerHTML = DATA[lang].nav.map(([id,label]) =>
    `<button class="nav-btn ${id===currentSection?"active":""}" type="button" data-section="${id}">${label}</button>`
  ).join("");
  nav.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click",()=>openSection(btn.dataset.section));
  });
}

function translateUI(){
  const ui = DATA[lang].ui;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(ui[key]) el.textContent = ui[key];
  });
  langBtn.textContent = lang === "en" ? "FA" : "EN";
  renderNav();
  if(currentSection) renderSection(currentSection);
}

function cardHTML(c,idx){
  return `
  <button class="card" type="button" data-card="${idx}" ${c.action?`data-action="${c.action}"`:""}>
    <div class="card-top">
      <div>
        <div class="card-kicker">${c.k}</div>
        <h3>${c.t}</h3>
      </div>
      <span class="chev">›</span>
    </div>
    <p>${c.p}</p>
    <div class="card-extra"><div>
      <div class="extra-inner">${c.x}
        <div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
    </div></div>
  </button>`;
}

function renderSection(id){
  const s = DATA[lang].sections[id];
  panelEyebrow.textContent = s.eyebrow;
  panelTitle.textContent = s.title;
  panelDesc.textContent = s.desc;
  feed.innerHTML = s.cards.map(cardHTML).join("");
  feed.scrollTop = 0;
  feed.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
      const action = card.dataset.action;
      if(action === "teaser"){
        openVideo();
        return;
      }
      const was = card.classList.contains("open");
      feed.querySelectorAll(".card.open").forEach(x=>x.classList.remove("open"));
      if(!was) card.classList.add("open");
    });
  });
}

function openSection(id){
  currentSection = id;
  closeVideo();
  renderNav();
  renderSection(id);
  app.classList.add("panel-open");
  panel.setAttribute("aria-hidden","false");
  nav.classList.remove("mobile-open");
}
function closePanel(){
  app.classList.remove("panel-open");
  panel.setAttribute("aria-hidden","true");
  currentSection = null;
  renderNav();
}
function openVideo(){
  closePanel();
  app.classList.add("video-open");
  document.getElementById("videoModal").setAttribute("aria-hidden","false");
  if(TEASER_URL){
    videoFrame.src = TEASER_URL;
    videoFrame.style.display = "block";
  }else{
    videoFrame.style.display = "none";
  }
}
function closeVideo(){
  app.classList.remove("video-open");
  document.getElementById("videoModal").setAttribute("aria-hidden","true");
  if(videoFrame.src) videoFrame.src = "";
}

document.getElementById("homeBtn").addEventListener("click",()=>{closePanel();closeVideo()});
document.getElementById("panelClose").addEventListener("click",closePanel);
document.getElementById("videoClose").addEventListener("click",closeVideo);
document.getElementById("scrim").addEventListener("click",()=>{closePanel();closeVideo()});
document.getElementById("teaserHit").addEventListener("click",openVideo);
langBtn.addEventListener("click",()=>{
  lang = lang === "en" ? "fa" : "en";
  translateUI();
});
menuBtn.addEventListener("click",()=>nav.classList.toggle("mobile-open"));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closePanel();closeVideo();nav.classList.remove("mobile-open")}
});

translateUI();
</script>
</body>
</html>
